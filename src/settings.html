<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AINode Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <div class="brand">
      <img src="logo.png" alt="">
      <h1>AINode Settings</h1>
    </div>
    <p class="lead">Point this app at your master AINode. That is the only setting.</p>

    <div class="field">
      <label for="primary">Primary address</label>
      <div class="row">
        <input type="text" id="primary" placeholder="192.168.0.10:3000" autocomplete="off" spellcheck="false" autofocus>
        <button type="button" id="test-primary">Test</button>
      </div>
      <div class="result" id="result-primary"></div>
      <div class="hint">The IP address and port of the node that runs the AINode web UI. Port 3000 is the default.</div>
    </div>

    <div class="field">
      <label for="alternate">Alternate address <span style="color: var(--text-3); font-weight: 400;">(optional)</span></label>
      <div class="row">
        <input type="text" id="alternate" placeholder="100.122.26.9:3000" autocomplete="off" spellcheck="false">
        <button type="button" id="test-alternate">Test</button>
      </div>
      <div class="result" id="result-alternate"></div>
      <div class="hint">A second way to reach the same node, like its tailnet address. The app uses whichever one answers.</div>
    </div>

    <div class="error" id="error"></div>

    <div class="actions">
      <button type="button" id="cancel">Cancel</button>
      <button type="button" class="primary" id="save">Save and open</button>
    </div>
    <div class="footer">Made in Texas</div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
