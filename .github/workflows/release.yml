name: Release

# Builds the universal macOS app on every v* tag and attaches the .dmg and a
# zipped .app to the GitHub Release for that tag. Signing and notarization
# switch on by themselves when the Apple secrets exist (see docs/RELEASING.md);
# without them the build still succeeds and ships unsigned.
#
# Signing: the Developer ID certificate (APPLE_CERTIFICATE, a base64 .p12) is
# imported into a throwaway keychain that lives as long as the job, and Tauri
# signs with APPLE_SIGNING_IDENTITY out of it. Notarization goes through an
# App Store Connect API key (APPLE_API_KEY, APPLE_API_ISSUER, and
# APPLE_API_KEY_B64, which is written to a file and handed to Tauri as
# APPLE_API_KEY_PATH). Tauri notarizes and staples the .app; the disk image
# gets its own ticket in a step below, because Tauri signs the .dmg but does
# not notarize it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to its release (blank: build the current branch, artifacts only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: AINode
  BUNDLE_DIR: src-tauri/target/universal-apple-darwin/release/bundle

jobs:
  macos:
    name: macOS universal
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust stable (arm64 + x86_64 targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Check the tag matches the app version
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Same precedence Tauri uses: tauri.conf.json version (a string, or a
          # path to a JSON file holding one), else the Cargo.toml package version.
          app_version="$(node -e '
            const fs = require("fs");
            const path = require("path");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            let v = conf.version;
            if (typeof v === "string" && v.endsWith(".json")) {
              v = JSON.parse(fs.readFileSync(path.join("src-tauri", v), "utf8")).version;
            }
            if (!v) {
              const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
              const pkg = cargo.split(/^\[package\]\s*$/m)[1] || "";
              const m = pkg.split(/^\[/m)[0].match(/^\s*version\s*=\s*"([^"]+)"/m);
              v = m ? m[1] : "";
            }
            process.stdout.write(String(v || ""));
          ')"
          tag_version="${RELEASE_TAG#v}"
          echo "tag: ${RELEASE_TAG} (${tag_version})  app: ${app_version}"
          if [ "${tag_version}" != "${app_version}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match the app version ${app_version}. Bump src-tauri/tauri.conf.json first, then tag."
            exit 1
          fi

      # The secrets context cannot be read in a step's `if`, so this step turns
      # "which secrets exist" into two outputs the later steps key off. Signing
      # needs the certificate, its password and the identity; notarization
      # needs signing plus the three App Store Connect key parts. Two parts out
      # of three would be a submission that fails after the build instead of
      # before it, so it is all three or none.
      - name: Decide whether this run signs and notarizes
        id: gate
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          set -euo pipefail
          sign=false
          notarize=false
          if [ -n "${CERT}" ] && [ -n "${CERT_PASSWORD}" ] && [ -n "${IDENTITY}" ]; then
            sign=true
          fi
          if [ "${sign}" = true ] && [ -n "${API_KEY}" ] && [ -n "${API_ISSUER}" ] && [ -n "${API_KEY_B64}" ]; then
            notarize=true
          fi
          {
            echo "sign=${sign}"
            echo "notarize=${notarize}"
          } >> "$GITHUB_OUTPUT"
          echo "Signing: ${sign}  Notarization: ${notarize}"
          if [ "${sign}" != true ]; then
            echo "::warning::APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD or APPLE_SIGNING_IDENTITY is not set. Building unsigned. Users must right-click Open (or use Privacy and Security, Open Anyway) the first time."
          elif [ "${notarize}" != true ]; then
            echo "::warning::APPLE_API_KEY, APPLE_API_ISSUER or APPLE_API_KEY_B64 is missing: the app will be signed but not notarized, and Gatekeeper will still hold the download."
          fi

      # A throwaway keychain that lives as long as the job. Its password is
      # generated here rather than kept as a secret: a secret whose only job is
      # to unlock a keychain this job just created is a secret nobody needs to
      # hold. Importing here, rather than handing APPLE_CERTIFICATE to Tauri,
      # means a bad .p12 or password fails in seconds instead of after the
      # ten minute compile, and the identity is on the log before the build.
      - name: Import the signing certificate into a throwaway keychain
        if: steps.gate.outputs.sign == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          keychain="${RUNNER_TEMP}/ainode-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "::add-mask::${keychain_password}"

          # Whitespace-tolerant: a wrapped base64 export decodes the same.
          printf '%s' "${APPLE_CERTIFICATE}" | tr -d '[:space:]' | base64 --decode > "${RUNNER_TEMP}/certificate.p12"

          security create-keychain -p "${keychain_password}" "${keychain}"
          # Six hour timeout and no lock-on-sleep, so it outlives the build.
          security set-keychain-settings -t 21600 -u "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${keychain}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${RUNNER_TEMP}/certificate.p12"

          # Without this, codesign prompts for keychain access and hangs the run.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain}" > /dev/null

          # create-keychain does not add to the search list, and codesign only
          # looks at the search list: prepend it to whatever is there, and make
          # it the default so Tauri's plain `codesign -s <identity>` finds it.
          existing=()
          while IFS= read -r k; do
            [ -n "${k}" ] && existing+=("${k}")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "${keychain}" ${existing[@]+"${existing[@]}"}
          security default-keychain -s "${keychain}"

          echo "Identities available to codesign:"
          identities="$(security find-identity -v -p codesigning "${keychain}")"
          echo "${identities}"
          if ! printf '%s' "${identities}" | grep -qF "${APPLE_SIGNING_IDENTITY}"; then
            echo "::error::The certificate in APPLE_CERTIFICATE does not carry a valid identity matching APPLE_SIGNING_IDENTITY. Check the .p12, its password and the identity string (docs/RELEASING.md)."
            exit 1
          fi
          # Tauri reads this name from the environment and signs out of the
          # default keychain. Exported only now, so an unsigned run never sees it.
          echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "$GITHUB_ENV"

      # notarytool reads the App Store Connect key from a file, never from the
      # environment. It is written inside the job, never echoed, and removed at
      # the end. Tauri picks the API key route when APPLE_ID is absent and
      # APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_KEY_PATH are set.
      # APPLE_TEAM_ID is optional here (Tauri only requires it on the Apple ID
      # route) and is passed through when present.
      - name: Stage the notarization key
        if: steps.gate.outputs.notarize == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "${APPLE_API_KEY_B64}" | tr -d '[:space:]' | base64 --decode > "${key_path}"
          if ! head -n 1 "${key_path}" | grep -q 'BEGIN PRIVATE KEY'; then
            rm -f "${key_path}"
            echo "::error::APPLE_API_KEY_B64 did not decode to a PEM private key. It should be the base64 of the AuthKey_<KEY_ID>.p8 file."
            exit 1
          fi
          # Prove the key is accepted by the notary service before the long
          # build, not after it. history is read-only and submits nothing.
          xcrun notarytool history --key "${key_path}" --key-id "${APPLE_API_KEY}" --issuer "${APPLE_API_ISSUER}" > /dev/null
          {
            echo "APPLE_API_KEY=${APPLE_API_KEY}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
            echo "APPLE_API_KEY_PATH=${key_path}"
          } >> "$GITHUB_ENV"
          if [ -n "${APPLE_TEAM_ID}" ]; then
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}" >> "$GITHUB_ENV"
          fi
          echo "Notarization: on (App Store Connect API key ${APPLE_API_KEY}, credentials accepted by the notary service)"

      # The Rust cache can carry an older bundle between runs; a stale .dmg in
      # the output directory would be the one the collect step picks up.
      - name: Clean stale bundle output
        run: rm -rf "${BUNDLE_DIR}"

      # Tauri signs every binary inside out, then (with the notarization
      # variables set) zips the .app, submits it, waits for the verdict and
      # staples the ticket, then builds the .dmg from the stapled .app and
      # signs the image.
      - name: Build universal macOS app
        run: npm run tauri build -- --target universal-apple-darwin

      # Tauri notarizes the app and not the disk image. A .dmg with no ticket
      # of its own still opens, because Gatekeeper falls back to asking Apple
      # over the network, but on a machine with no network at that moment it is
      # held. So the disk image gets its own ticket, and stapling it is the
      # difference between a download that opens and one that has to be argued
      # with. `notarytool submit --wait` has exited 0 for a rejected submission
      # before, so the verdict is read from its JSON, not its exit code.
      - name: Notarize and staple the disk image
        if: steps.gate.outputs.notarize == 'true'
        run: |
          set -euo pipefail
          dmg="$(find "${BUNDLE_DIR}/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [ -z "${dmg}" ]; then
            echo "::error::No .dmg found under ${BUNDLE_DIR}/dmg"
            exit 1
          fi
          echo "submitting $(basename "${dmg}")"
          set +e
          xcrun notarytool submit "${dmg}" \
            --key "${APPLE_API_KEY_PATH}" --key-id "${APPLE_API_KEY}" --issuer "${APPLE_API_ISSUER}" \
            --wait --timeout 30m --output-format json > "${RUNNER_TEMP}/notary.json"
          submit_rc=$?
          set -e
          cat "${RUNNER_TEMP}/notary.json"; echo
          status="$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).status||"")}catch(e){}' "${RUNNER_TEMP}/notary.json")"
          id="$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).id||"")}catch(e){}' "${RUNNER_TEMP}/notary.json")"
          if [ "${status}" != "Accepted" ]; then
            echo "::error::Apple did not accept the disk image (status ${status:-unknown}, exit ${submit_rc}). The notary log follows."
            if [ -n "${id}" ]; then
              xcrun notarytool log "${id}" --key "${APPLE_API_KEY_PATH}" --key-id "${APPLE_API_KEY}" --issuer "${APPLE_API_ISSUER}" || true
            fi
            exit 1
          fi
          xcrun stapler staple "${dmg}"
          echo "stapled $(basename "${dmg}")"

      # Hard gate on a signing run: the artifact only ships if macOS itself
      # accepts it. spctl is the check Gatekeeper performs on a user's machine,
      # and "accepted" alone is not enough: a signed-but-never-submitted build
      # reports "source=Unnotarized Developer ID" and would trip Gatekeeper.
      # Only "source=Notarized Developer ID" passes.
      - name: Verify the signature and the notarization ticket
        if: steps.gate.outputs.sign == 'true'
        env:
          NOTARIZED: ${{ steps.gate.outputs.notarize }}
        run: |
          set -euo pipefail
          app="$(find "${BUNDLE_DIR}/macos" -maxdepth 1 -name '*.app' | head -n 1)"
          dmg="$(find "${BUNDLE_DIR}/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          echo "=== codesign --verify ${app} ==="
          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign -dv --verbose=4 "${app}" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'
          echo "=== codesign --verify ${dmg} ==="
          codesign --verify --strict --verbose=2 "${dmg}"
          if [ "${NOTARIZED}" != "true" ]; then
            echo "Signed but not notarized, so Gatekeeper is not checked here."
            exit 0
          fi
          fail=0
          echo "=== spctl ${app} ==="
          out="$(spctl --assess --type execute -vv "${app}" 2>&1)" || fail=1
          echo "${out}"
          printf '%s' "${out}" | grep -q 'source=Notarized Developer ID' || { echo "::error::The app is not notarized (expected source=Notarized Developer ID)."; fail=1; }
          echo "=== stapler validate ${app} ==="
          xcrun stapler validate "${app}" || { echo "::error::The app has no stapled ticket."; fail=1; }
          echo "=== spctl ${dmg} ==="
          # Disk images need the explicit open assessment context.
          out="$(spctl --assess --type open --context context:primary-signature -vv "${dmg}" 2>&1)" || fail=1
          echo "${out}"
          printf '%s' "${out}" | grep -q 'source=Notarized Developer ID' || { echo "::error::The disk image is not notarized (expected source=Notarized Developer ID)."; fail=1; }
          echo "=== stapler validate ${dmg} ==="
          xcrun stapler validate "${dmg}" || { echo "::error::The disk image has no stapled ticket."; fail=1; }
          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
          echo "The app and the disk image are signed, notarized and stapled."

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          app="$(find "${BUNDLE_DIR}/macos" -maxdepth 1 -name '*.app' | head -n 1)"
          dmg="$(find "${BUNDLE_DIR}/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [ -z "${app}" ] || [ -z "${dmg}" ]; then
            echo "::error::Bundle output not found under ${BUNDLE_DIR}"
            ls -R "${BUNDLE_DIR}" || true
            exit 1
          fi
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app}/Contents/Info.plist")"
          mkdir -p dist
          cp "${dmg}" "dist/${APP_NAME}_${version}_universal.dmg"
          # ditto keeps symlinks, resource forks and permissions, which a plain zip drops.
          ditto -c -k --sequesterRsrc --keepParent "${app}" "dist/${APP_NAME}_${version}_universal.app.zip"
          (cd dist && shasum -a 256 -- *.dmg *.zip > "${APP_NAME}_${version}_universal.sha256")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "--- dist ---"
          ls -la dist
          echo "--- signature ---"
          codesign -dv --verbose=2 "${app}" 2>&1 || echo "unsigned"
          echo "--- architectures ---"
          lipo -archs "${app}/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app}/Contents/Info.plist")"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.collect.outputs.version }}-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: |
            dist/*.dmg
            dist/*.app.zip
            dist/*.sha256

      # The runner is thrown away, so this is belt and braces: the key and the
      # keychain do not sit in a temp directory for the rest of the job.
      - name: Remove the signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}"/AuthKey_*.p8 "${RUNNER_TEMP}/certificate.p12"
          if [ -f "${RUNNER_TEMP}/ainode-signing.keychain-db" ]; then
            security default-keychain -s login.keychain-db || true
            security delete-keychain "${RUNNER_TEMP}/ainode-signing.keychain-db" || true
          fi
